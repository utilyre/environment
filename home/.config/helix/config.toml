theme = "custom"

[editor]
auto-format = false
auto-save.focus-lost = true
auto-save.after-delay.enable = true
auto-save.after-delay.timeout = 500

completion-timeout = 5
completion-trigger-len = 1
smart-tab.enable = false

file-picker.hidden = false
file-picker.git-exclude = false

scrolloff = 1
soft-wrap.enable = true
rulers = [80, 100]
indent-guides.render = true
cursor-shape.insert = "bar"
inline-diagnostics.cursor-line = "hint"

[editor.statusline]
left = [
  "total-line-numbers",
  "file-name",
  "read-only-indicator",
  "spacer",
  "spacer",
  "spacer",
  "version-control",
]
center = ["register"]
right = [
  "diagnostics",
  "spacer",
  "spacer",
  "primary-selection-length",
  "selections",
  "spacer",
  "spacer",
  "position",
]

[keys.normal]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
x = "select_line_below"
X = "select_line_above"
C-y = "scroll_up"
C-e = "scroll_down"
A-w = "move_next_sub_word_start"
A-b = "move_prev_sub_word_start"
A-e = "move_next_sub_word_end"
A-l = "@*vnv"
A-S-l = "@*vNv"
A-S-i = ":fmt"

[keys.select]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
x = "select_line_below"
X = "select_line_above"
C-y = "scroll_up"
C-e = "scroll_down"
A-w = "extend_next_sub_word_start"
A-b = "extend_prev_sub_word_start"
A-e = "extend_next_sub_word_end"
A-l = "@*n"
A-S-l = "@*N"
A-S-i = ":fmt"

[keys.insert]
C-y = "scroll_up"
C-e = "scroll_down"
A-S-i = ":fmt"
j.k = "normal_mode"
k.j = "normal_mode"
