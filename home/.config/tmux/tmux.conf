set-option -ga terminal-features *:rgb,*:usstyle
set-option -g copy-command wl-copy
set-option -g focus-events on
set-option -g set-titles on
set-option -g escape-time 0
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g status off
set-option -g mouse on
set-option -g mode-keys vi
set-option -g status-keys emacs
set-option -g prefix C-Space

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key v run-shell 'tmux split-window -h kak -c #S'
bind-key h run-shell 'tmux split-window -v kak -c #S'

bind-key -n C-\\ display-popup -E -w80% -h80% tig status
bind-key -n F9 display-message build \; clear-history -Ht 2.1 \; respawn-pane -kt 2.1 gal build
bind-key -n F5 display-message debug \; clear-history -Ht 2.1 \; respawn-pane -kt 2.1 gal debug
